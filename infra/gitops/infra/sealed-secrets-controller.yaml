# Sealed Secrets Controller — installed via plain Kubernetes manifest.
#
# Sealed Secrets lets us encrypt Kubernetes secrets and safely commit the
# encrypted SealedSecret CRDs to Git. Only this in-cluster controller
# (with the private key) can decrypt them into real Kubernetes Secrets.
#
# Version is pinned for reproducibility. Update periodically.
# Source: https://github.com/bitnami-labs/sealed-secrets/releases
apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
---
# The controller installs into kube-system and manages all namespaces.
# Fetched at apply time via kubectl — ArgoCD handles the raw manifest URL.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # Before any SealedSecret resources
spec:
  project: default
  source:
    chart: sealed-secrets
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    targetRevision: 2.16.1
    helm:
      releaseName: sealed-secrets
      values: |
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
