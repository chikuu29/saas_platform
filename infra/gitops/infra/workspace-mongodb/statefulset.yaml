apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: workspace-mongodb
  namespace: workspace
  labels:
    app: workspace-mongodb
    app.kubernetes.io/part-of: saas-platform
spec:
  serviceName: workspace-mongodb
  replicas: 1
  selector:
    matchLabels:
      app: workspace-mongodb
  template:
    metadata:
      labels:
        app: workspace-mongodb
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
              name: mongodb
          envFrom:
            - secretRef:
                name: workspace-mongodb-secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
            # Mount init script from ConfigMap — runs only on first start
            - name: mongo-init
              mountPath: /docker-entrypoint-initdb.d/init-mongo.js
              subPath: init-mongo.js
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: workspace-mongodb-pvc
        - name: mongo-init
          configMap:
            name: mongo-init-script
