# SealedSecret — MongoDB credentials for workspace-backend.
#
# HOW TO GENERATE:
#   1. Create a plain secret (DO NOT COMMIT THIS):
#        kubectl create secret generic workspace-mongodb-secret \
#          --namespace workspace \
#          --from-literal=MONGO_INITDB_ROOT_USERNAME=workspace_admin \
#          --from-literal=MONGO_INITDB_ROOT_PASSWORD=<your-password> \
#          --from-literal=MONGO_URI="mongodb://workspace_admin:<your-password>@workspace-mongodb:27017/workspace_db?authSource=admin" \
#          --dry-run=client -o yaml > /tmp/workspace-mongodb-secret.yaml
#   2. Seal it:
#        kubeseal --controller-name=sealed-secrets-controller \
#          --controller-namespace=kube-system \
#          --format yaml < /tmp/workspace-mongodb-secret.yaml > \
#          infra/gitops/infra/workspace-mongodb/sealed-secret.yaml
#   3. Commit the sealed version only.
#
# PLACEHOLDER — replace encryptedData values with your real kubeseal output.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: workspace-mongodb-secret
  namespace: workspace
spec:
  encryptedData:
    MONGO_INITDB_ROOT_USERNAME: REPLACE_WITH_KUBESEAL_OUTPUT
    MONGO_INITDB_ROOT_PASSWORD: REPLACE_WITH_KUBESEAL_OUTPUT
    MONGO_URI: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: workspace-mongodb-secret
      namespace: workspace
    type: Opaque
