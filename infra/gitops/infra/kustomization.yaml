apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Order matters: Sealed Secrets controller must exist before SealedSecret
# resources are applied, so it is listed first.
resources:
  - sealed-secrets-controller.yaml
  - identity-postgres/
  - identity-redis/
  - workspace-mongodb/
  - ingress-nginx-tls-sealed.yaml
