# SealedSecret — PostgreSQL credentials for identity-backend.
#
# HOW TO GENERATE (run after kubectl is pointed at your cluster):
#   1. Install kubeseal: https://github.com/bitnami-labs/sealed-secrets/releases
#   2. Create a plain secret YAML (DO NOT COMMIT THE PLAIN VERSION):
#        kubectl create secret generic identity-postgres-secret \
#          --namespace identity \
#          --from-literal=POSTGRES_USER=postgres \
#          --from-literal=POSTGRES_PASSWORD=<your-password> \
#          --from-literal=DATABASE_URL="postgresql+asyncpg://postgres:<your-password>@identity-postgres:5432/identity_provider_database" \
#          --dry-run=client -o yaml > /tmp/identity-postgres-secret.yaml
#   3. Seal it:
#        kubeseal --controller-name=sealed-secrets-controller \
#          --controller-namespace=kube-system \
#          --format yaml < /tmp/identity-postgres-secret.yaml > \
#          infra/gitops/infra/identity-postgres/sealed-secret.yaml
#   4. Commit infra/gitops/infra/identity-postgres/sealed-secret.yaml
#
# PLACEHOLDER — replace encryptedData values with your real kubeseal output.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: identity-postgres-secret
  namespace: identity
spec:
  encryptedData:
    # Replace these placeholder values with real kubeseal output
    POSTGRES_USER: REPLACE_WITH_KUBESEAL_OUTPUT
    POSTGRES_PASSWORD: REPLACE_WITH_KUBESEAL_OUTPUT
    DATABASE_URL: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: identity-postgres-secret
      namespace: identity
    type: Opaque
