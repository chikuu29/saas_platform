# NGINX Ingress for Identity services.
#
# Routing rules (after rewrite strips the /api prefix):
#   identity.local/api/(...) → identity-backend:8000/(...) (FastAPI routes have no /api prefix)
#   identity.local/.well-known → identity-backend:8000/.well-known
#   identity.local/health      → identity-backend:8000/health
#   identity.local/            → identity-web:80  (React SPA — catch-all)
#
# The rewrite-target strips /api so FastAPI receives /oauth2/token not /api/oauth2/token.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: identity-ingress
  namespace: identity
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "http://identity.local,http://workspace.local"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    # Strip /api prefix before forwarding to FastAPI.
    # /api/auth/me  → FastAPI sees /auth/me
    # /api/oauth2/token → FastAPI sees /oauth2/token
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: identity.local
      http:
        paths:
          # /api/(...) → identity-backend — regex strips /api prefix via rewrite-target
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: identity-backend
                port:
                  number: 8000
          # Well-known OIDC paths → FastAPI backend (no rewrite needed)
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: identity-backend
                port:
                  number: 8000
          # Health probe passthrough → backend directly
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: identity-backend
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: identity-backend
                port:
                  number: 8000
          # Everything else → React SPA
          - path: /
            pathType: Prefix
            backend:
              service:
                name: identity-web
                port:
                  number: 80

