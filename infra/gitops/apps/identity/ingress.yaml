# Identity Ingress — Split into two Ingress resources.
#
# WHY TWO INGRESS RESOURCES?
# nginx.ingress.kubernetes.io/rewrite-target is a PER-INGRESS annotation.
# If set on one Ingress with multiple paths, it applies to ALL paths.
# This breaks the React SPA path (/) because $2 has no match → NGINX breaks.
#
# Solution: One Ingress for /api (with rewrite), one for everything else (no rewrite).

# ─── Ingress 1: API routes → FastAPI backend (strips /api prefix) ────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: identity-ingress-api
  namespace: identity
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "http://identity.local,http://workspace.local"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    # Strip /api prefix: /api/auth/me → FastAPI receives /auth/me
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: identity.local
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: identity-backend
                port:
                  number: 8000
          # Well-known OIDC paths — no rewrite needed, FastAPI has these at root
          - path: /.well-known(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: identity-backend
                port:
                  number: 8000
---
# ─── Ingress 2: Health/metrics passthrough + React SPA (no rewrite) ──────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: identity-ingress-web
  namespace: identity
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: identity.local
      http:
        paths:
          # Health probes — direct to backend, no rewrite
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: identity-backend
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: identity-backend
                port:
                  number: 8000
          # React SPA — catch-all, NGINX in pod serves index.html
          - path: /
            pathType: Prefix
            backend:
              service:
                name: identity-web
                port:
                  number: 80
