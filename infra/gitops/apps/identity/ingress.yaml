# NGINX Ingress for Identity services.
#
# Routing rules:
#   identity.local/api/ → identity-backend:8000  (FastAPI — all /auth, /oauth2, etc.)
#   identity.local/     → identity-web:80         (React SPA — catch-all)
#
# NGINX processes rules in order: more specific paths (/api) win over catch-all (/).
# proxy_pass preserves the /api prefix — FastAPI sees the full path including /api.
# If you want to strip /api before FastAPI, add the rewrite annotation below.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: identity-ingress
  namespace: identity
  annotations:
    # Use the NGINX Ingress Controller (not Traefik)
    kubernetes.io/ingress.class: "nginx"
    # Enable CORS at the NGINX level — FastAPI also handles CORS but this is a safety net
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "http://identity.local,http://workspace.local"
    # Increase timeouts for slow FastAPI startup or long auth operations
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    # Buffer size for large JWT token responses
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    # Forward real client IP to FastAPI for rate limiting
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: identity.local
      http:
        paths:
          # API routes → FastAPI backend (more specific path listed first)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: identity-backend
                port:
                  number: 8000
          # Well-known OIDC paths → also served by FastAPI backend
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: identity-backend
                port:
                  number: 8000
          # Health and metrics → backend (not proxied through React)
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: identity-backend
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: identity-backend
                port:
                  number: 8000
          # Everything else → React SPA
          - path: /
            pathType: Prefix
            backend:
              service:
                name: identity-web
                port:
                  number: 80
