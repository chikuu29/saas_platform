apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace "identity" is owned by saas-platform-infra (wave 0) via platform/namespaces/.
# app-identity must NOT re-declare it — doing so causes ArgoCD tracking-id conflicts.
# CreateNamespace=true in app-identity.yaml handles the fallback safely.
resources:
  - configmap.yaml
  - identity-backend-deployment.yaml
  - identity-keys-pvc.yaml
  - identity-backend-service.yaml
  - identity-backend-hpa.yaml
  - identity-web-deployment.yaml
  - ingress.yaml
