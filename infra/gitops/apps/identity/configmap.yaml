# Non-secret runtime configuration for identity-backend.
# Secrets (DATABASE_URL, SECRET_KEY etc.) are in SealedSecrets only.
# This ConfigMap holds environment variables that are safe to version-control.
apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-backend-config
  namespace: identity
data:
  ENV: "production"
  DOMAIN_NAME: "https://identity.local"
  CORS_ORIGINS: "https://identity.local,https://workspace.local,http://localhost"
  POLICY_ENGINE: "local"
  # Redis — internal Kubernetes DNS (ClusterIP service in identity namespace)
  REDIS_URL: "redis://identity-redis:6379/0"
  # Token lifetimes (seconds)
  ACCESS_TOKEN_EXPIRY: "900"
  REFRESH_TOKEN_EXPIRY: "1296000"
  ID_TOKEN_EXPIRY: "3600"
  AUTH_CODE_EXPIRY: "300"
  # Rate limiting
  RATE_LIMIT_LOGIN: "10"
  RATE_LIMIT_TOKEN: "20"
  RATE_LIMIT_WINDOW: "60"
  # SMTP — Gmail (credentials come from SealedSecret)
  SMTP_SERVER: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USE_TLS: "true"
  FROM_NAME: "SaaS Platform"

