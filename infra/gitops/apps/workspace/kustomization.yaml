apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace "workspace" is owned by saas-platform-infra (wave 0) via platform/namespaces/.
# app-workspace must NOT re-declare it — doing so causes ArgoCD tracking-id conflicts.
# CreateNamespace=true in app-workspace.yaml handles the fallback safely.
resources:
  - configmap.yaml
  - workspace-app-secret.yaml          # App-level SealedSecret: OAUTH_CLIENT_ID, OAUTH_CLIENT_SECRET, SECRET_KEY
  - workspace-storage-pvc.yaml         # Persistent storage for uploads
  - workspace-backend-deployment.yaml
  - workspace-backend-service.yaml
  - workspace-backend-hpa.yaml
  - workspace-web-deployment.yaml
  - workspace-web-service.yaml
  - ingress.yaml
