# Workspace Ingress — Four YAML documents in this file:
#
#   1. workspace-ingress-api      — /backend/* → workspace-backend  (prefix-strip rewrite)
#   2. workspace-ingress-identity — /identity/* → identity-backend   (dedicated, HTTP upstream)
#   3. workspace-ingress-web      — /public, /health, /metrics, /   (no rewrite)
#   4. identity-backend-external  — ExternalName Service (cross-namespace bridge)
#
# WHY SEPARATE INGRESS PER SERVICE GROUP?
# nginx.ingress.kubernetes.io/rewrite-target is a PER-INGRESS annotation.
# workspace-backend and identity-backend are different upstreams with different
# protocol requirements (identity must be explicit HTTP, workspace-backend is HTTP too
# but needs different CORS/proxy settings). Mixing them in one Ingress resource
# causes annotation conflicts and 502 errors.
#
# WHY /backend (not /api):
# api.ts uses /backend as base URL. Matching prefix in Vite proxy AND K8s ingress
# means zero environment-specific URL differences between dev and prod.


# ─── Ingress 1: /backend → workspace backend (prefix-strip rewrite) ───────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workspace-ingress-api
  namespace: workspace
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://workspace.local,https://identity.local"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    # Rewrite: captures everything after /backend and replaces the full path.
    #   /backend/v1/users     → /v1/users
    #   /backend/docs         → /docs
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - workspace.local
  rules:
    - host: workspace.local
      http:
        paths:
          - path: /backend(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: workspace-backend
                port:
                  number: 8001
---
# ─── Ingress 2: /identity → identity-backend (dedicated, isolated) ────────────
#
# WHY A SEPARATE INGRESS for /identity?
#
# 1. backend-protocol: "HTTP" is required.
#    nginx-ingress defaults to attempting HTTPS on any upstream when the cluster
#    uses TLS termination. Without this annotation, nginx sends an HTTPS handshake
#    to identity-backend port 8000 (HTTP only) → immediate 502 Bad Gateway.
#
# 2. upstream-vhost sets the Host header on proxied requests.
#    Without this, nginx sends Host: workspace.local to identity-backend.
#    FastAPI's middleware or CORS checks may reject the mismatched host.
#
# 3. rewrite-target: /$2 strips the /identity prefix.
#    /identity/account/organization/users → /account/organization/users
#    Identity FastAPI receives the bare path its routers expect.
#
# Traffic chain:
#   Browser  → workspace.local/identity/account/organization/users  (HTTPS)
#   nginx-ic → strips TLS, rewrites to /account/organization/users
#            → proxy_pass HTTP to identity-backend-external:8000
#   ExternalName CNAME → identity-backend.identity.svc.cluster.local:8000
#   FastAPI  → /account/organization/users → handler ✅
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workspace-ingress-identity
  namespace: workspace
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # ── Critical for ExternalName + HTTP upstream ─────────────────────────────
    # Tells nginx-ingress to proxy using plain HTTP (not HTTPS) to the upstream.
    # Without this, nginx attempts an SSL handshake to port 8000 → 502.
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    # Sets the Host header on the proxied request to the actual upstream FQDN.
    # Prevents FastAPI/middleware from seeing "workspace.local" as the Host.
    nginx.ingress.kubernetes.io/upstream-vhost: "identity-backend.identity.svc.cluster.local"
    # CORS: identity API is consumed by the workspace frontend JS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://workspace.local"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    # Rewrite: strips /identity prefix before forwarding to identity-backend.
    #   /identity/account/organization/users → /account/organization/users
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - workspace.local
  rules:
    - host: workspace.local
      http:
        paths:
          - path: /identity(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: identity-backend-external
                port:
                  number: 8000
---
# ─── Ingress 3: Passthrough — static files, health, SPA catch-all ─────────────
# No rewrite annotation — all paths reach backends with their full path intact.
#
# /public  — FastAPI StaticFiles at /public/storage (file uploads/downloads)
# /health  — Kubernetes liveness/readiness probes
# /metrics — Prometheus scrape endpoint
# /        — React SPA; workspace-web nginx serves index.html for all unmatched routes
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workspace-ingress-web
  namespace: workspace
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - workspace.local
  rules:
    - host: workspace.local
      http:
        paths:
          - path: /public
            pathType: Prefix
            backend:
              service:
                name: workspace-backend
                port:
                  number: 8001
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: workspace-backend
                port:
                  number: 8001
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: workspace-backend
                port:
                  number: 8001
          # React SPA catch-all — must be last
          - path: /
            pathType: Prefix
            backend:
              service:
                name: workspace-web
                port:
                  number: 80
---
# ─── ExternalName Service: identity-backend cross-namespace bridge ────────────
# nginx-ingress Ingress rules can ONLY reference Services in the SAME namespace.
# identity-backend lives in the `identity` namespace. This ExternalName Service
# in the `workspace` namespace resolves via DNS CNAME to the cluster-internal FQDN.
#
# No pods, no kube-proxy rules — pure DNS redirect, zero overhead.
#
# Traffic path:
#   workspace-ingress-identity → identity-backend-external (ExternalName, workspace ns)
#   CNAME resolve              → identity-backend.identity.svc.cluster.local:8000
apiVersion: v1
kind: Service
metadata:
  name: identity-backend-external
  namespace: workspace
spec:
  type: ExternalName
  externalName: identity-backend.identity.svc.cluster.local
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
