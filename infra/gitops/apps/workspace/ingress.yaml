# Workspace Ingress
#
#   1. workspace-ingress-backend  — /backend/* (strips prefix)
#   2. workspace-ingress-identity — /identity/* (rewrites to /api/*)
#   3. workspace-ingress-web      — /public, /health, /metrics, / (no rewrite)
#   4. identity-backend-external  — Service bridge
#

# ─── Ingress 1: Workspace Backend ─────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workspace-ingress-backend
  namespace: workspace
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://workspace.local,https://identity.local"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - workspace.local
  rules:
    - host: workspace.local
      http:
        paths:
          - path: /backend(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: workspace-backend
                port:
                  number: 8001
---
# ─── Ingress 2: Identity Proxy ────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workspace-ingress-identity
  namespace: workspace
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://workspace.local,https://identity.local"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Rewrites /identity/foo -> /api/foo to match backend root_path="/api"
    nginx.ingress.kubernetes.io/rewrite-target: /api/$2
    # FIX: ExternalName must not use service-upstream
    nginx.ingress.kubernetes.io/service-upstream: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - workspace.local
  rules:
    - host: workspace.local
      http:
        paths:
          - path: /identity(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: identity-backend-external
                port:
                  number: 8000
---
# ─── Ingress 3: Web Passthrough ───────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workspace-ingress-web
  namespace: workspace
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - workspace.local
  rules:
    - host: workspace.local
      http:
        paths:
          - path: /public
            pathType: Prefix
            backend:
              service:
                name: workspace-backend
                port:
                  number: 8001
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: workspace-backend
                port:
                  number: 8001
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: workspace-backend
                port:
                  number: 8001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: workspace-web
                port:
                  number: 80
---
# ─── Service: ExternalName bridge ────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: identity-backend-external
  namespace: workspace
spec:
  type: ExternalName
  externalName: identity-backend.identity.svc.cluster.local
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
