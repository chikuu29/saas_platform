# Workspace Ingress — Three YAML documents in this file:
#
#   1. workspace-ingress-api   — /backend/* and /identity/* with prefix-strip rewrite
#   2. workspace-ingress-web   — /public, /health, /metrics, / passthrough
#   3. identity-backend-external Service — ExternalName stub for cross-namespace routing
#
# WHY TWO INGRESS RESOURCES?
# nginx.ingress.kubernetes.io/rewrite-target is a PER-INGRESS annotation.
# If set on one Ingress with multiple paths, it applies to ALL paths uniformly.
# This would break /public (static files) and / (React SPA) catch-all routes.
#
# Split strategy:
#   Ingress 1 (workspace-ingress-api): /backend/* → workspace-backend (strips /backend prefix)
#   Ingress 2 (workspace-ingress-web): /public, /health, /metrics, / → no rewrite
#
# WHY /backend (not /api):
# The React frontend's api.ts uses /backend as the base URL for all core API calls.
# Using the same prefix in both the Vite dev proxy AND the K8s nginx ingress means
# zero difference between dev and prod routing — no environment-specific URL logic needed.
#
# Full request path chain for API calls:
#   Client:  https://workspace.local/backend/v1/users
#   nginx:   strips /backend (rewrite-target: /$2) → backend receives: /v1/users
#   FastAPI: router prefix="/v1" matches → handler runs ✅
#
# Swagger UI path chain:
#
# TWO PREFIXES on Ingress 1:
#   /backend — api.ts runtime calls (mirroring the Vite dev proxy convention)
#   /api     — Swagger schema fetch only (FastAPI root_path="/api" hardcodes this)
#
# Swagger UI path chain:
#   Browser: https://workspace.local/backend/docs
#   nginx:   strips /backend → backend receives: /docs → serves Swagger HTML
#   Swagger: fetches /api/openapi.json  (root_path="/api" in FastAPI)
#   nginx:   /api rule strips /api → backend receives: /openapi.json → OpenAPI JSON ✅


# ─── Ingress 1: /backend and /api → workspace backend (rewrite strips prefix) ─
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workspace-ingress-api
  namespace: workspace
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://workspace.local,https://identity.local"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    # Rewrite: strips the matched prefix, leaves the rest.
    #   /backend/v1/users     → /v1/users
    #   /backend/docs         → /docs
    #   /api/openapi.json     → /openapi.json  (Swagger schema)
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - workspace.local
  rules:
    - host: workspace.local
      http:
        paths:
          # All backend traffic: API calls, Swagger UI, Swagger schema.
          # root_path="/backend" ensures Swagger generates /backend/... URLs,
          # so this single rule handles everything:
          #   /backend/v1/users     → /v1/users
          #   /backend/docs         → /docs
          #   /backend/openapi.json → /openapi.json
          - path: /backend(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: workspace-backend
                port:
                  number: 8001

          # ── Identity server proxy (cross-namespace) ───────────────────────
          # The workspace frontend calls the identity server with the prefix
          # /identity (set in api.ts getBaseUrl("identity") and mirrored in
          # the Vite dev proxy in vite.config.ts).
          #
          # This ingress rule strips the /identity prefix and forwards the
          # bare path to the identity-backend service in the identity namespace.
          #
          # Request chain:
          #   Browser:  https://workspace.local/identity/account/organization/users
          #   nginx:    strips /identity (rewrite /$2) → /account/organization/users
          #   Identity: FastAPI receives /account/organization/users → handler runs ✅
          #
          # WHY here (workspace ingress) and NOT identity.local?
          # The workspace frontend is served from workspace.local. Cross-origin
          # fetch to identity.local would require CORS credentials + cookie
          # sharing across two origins — complex and fragile. Proxying through
          # the same origin (/identity on workspace.local) keeps cookies and
          # auth headers on a single origin.
          - path: /identity(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: identity-backend-external
                port:
                  number: 8000
---
# ─── Ingress 2: Passthrough — no rewrite ─────────────────────────────────────
# All paths in this ingress reach the backend/SPA with their full path intact.
#
# /public  — FastAPI StaticFiles mount at /public/storage (file uploads/downloads).
#            Must NOT be rewritten — the path prefix is part of the mount point.
# /health  — Kubernetes liveness/readiness probes (no auth, no rewrite).
# /metrics — Prometheus scrape endpoint (no auth, no rewrite).
# /        — React SPA catch-all; workspace-web Nginx pod serves index.html for
#            all unmatched routes to support client-side routing.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workspace-ingress-web
  namespace: workspace
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    # Max body size still needed for file upload paths proxied through Ingress 2
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - workspace.local
  rules:
    - host: workspace.local
      http:
        paths:
          # Static file storage — FastAPI mounts /public/storage as StaticFiles
          - path: /public
            pathType: Prefix
            backend:
              service:
                name: workspace-backend
                port:
                  number: 8001
          # Kubernetes health probes
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: workspace-backend
                port:
                  number: 8001
          # Prometheus metrics scrape
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: workspace-backend
                port:
                  number: 8001
          # React SPA — catch-all; serves index.html for all unmatched routes
          - path: /
            pathType: Prefix
            backend:
              service:
                name: workspace-web
                port:
                  number: 80
---
# ─── ExternalName Service: identity-backend cross-namespace bridge ────────────
# nginx-ingress rules can ONLY reference Services in the SAME namespace.
# identity-backend lives in the `identity` namespace; this ExternalName stub
# in the `workspace` namespace resolves via CNAME to its cluster-internal FQDN.
#
# This replaces the separate identity-backend-external-svc.yaml file —
# consolidated here to keep all ingress-related resources in one place.
#
# Traffic path:
#   workspace-ingress-api (/identity/* rule)
#     → identity-backend-external   (ExternalName, workspace ns)
#     → identity-backend.identity.svc.cluster.local:8000  (actual pod)
apiVersion: v1
kind: Service
metadata:
  name: identity-backend-external
  namespace: workspace
spec:
  type: ExternalName
  externalName: identity-backend.identity.svc.cluster.local
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
