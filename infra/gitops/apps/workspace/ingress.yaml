# Workspace Ingress — Split into two Ingress resources, mirroring identity pattern.
#
# WHY TWO INGRESS RESOURCES? (same reason as identity)
# nginx.ingress.kubernetes.io/rewrite-target applies to ALL paths in an Ingress.
# The /api rewrite (/$2) breaks /public and / catch-all routes if combined.
#
# Split strategy:
#   Ingress 1 (workspace-ingress-api):  /api/*     → workspace-backend (strips /api prefix)
#   Ingress 2 (workspace-ingress-web):  /public, /health, /metrics, / → no rewrite

# ─── Ingress 1: API routes → workspace backend (strips /api prefix) ───────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workspace-ingress-api
  namespace: workspace
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://workspace.local,https://identity.local"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    # Strip /api prefix: /api/v1/users → workspace-backend receives /v1/users
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - workspace.local
  rules:
    - host: workspace.local
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: workspace-backend
                port:
                  number: 8001
---
# ─── Ingress 2: Passthrough — no rewrite ─────────────────────────────────────
# /public  — Static file storage served by FastAPI StaticFiles mount.
#            Must reach the backend with the full /public/... path intact.
# /health  — Kubernetes liveness/readiness probes.
# /metrics — Prometheus scrape endpoint.
# /        — React SPA catch-all; workspace-web Nginx pod serves index.html.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workspace-ingress-web
  namespace: workspace
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    # Max body size still needed for file upload paths served through Ingress 2
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - workspace.local
  rules:
    - host: workspace.local
      http:
        paths:
          # Static file storage — served by FastAPI StaticFiles mount at /public
          - path: /public
            pathType: Prefix
            backend:
              service:
                name: workspace-backend
                port:
                  number: 8001
          # Health probes — direct to backend, no rewrite
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: workspace-backend
                port:
                  number: 8001
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: workspace-backend
                port:
                  number: 8001
          # React SPA — everything else; workspace-web Nginx pod serves index.html
          - path: /
            pathType: Prefix
            backend:
              service:
                name: workspace-web
                port:
                  number: 80
