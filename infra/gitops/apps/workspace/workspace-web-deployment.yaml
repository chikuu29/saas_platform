apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-web
  namespace: workspace
  labels:
    app: workspace-web
    app.kubernetes.io/part-of: saas-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workspace-web
  template:
    metadata:
      labels:
        app: workspace-web
    spec:
      containers:
        - name: workspace-web
          image: docker.io/cchiku1999/saas-workspace-web:fa18fe60bd8672e594c33f991c9a7589ca424a4d
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          # Runtime env vars sourced from ConfigMap.
          # docker-entrypoint.sh reads these at pod startup and generates
          # /env-config.js → window._env_ → consumed by React via env.ts.
          # Update values in workspace-web-configmap.yaml, then:
          #   kubectl apply -f ... && kubectl rollout restart deployment/workspace-web -n workspace
          envFrom:
            - configMapRef:
                name: workspace-web-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
