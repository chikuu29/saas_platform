# Non-secret runtime configuration for workspace-backend.
# Credentials (MONGO_URI, SECRET_KEY etc.) are in SealedSecrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: workspace-backend-config
  namespace: workspace
data:
  ENV: "production"
  PROJECT_NAME: "Workspace Platform API"
  VERSION: "1.0.0"
  API_V1_STR: "v1"
  PORT: "8001"
  LOG_LEVEL: "INFO"
  DATABASE_NAME: "workspace_db"
  BACKEND_CORS_ORIGINS: '["https://workspace.local","https://identity.local","http://localhost"]'
  # Identity Server endpoints — cross-namespace via Kubernetes DNS
  OAUTH_OPENID_CONFIG_URL: "http://identity-backend.identity.svc.cluster.local:8000/.well-known/openid-configuration"
  OAUTH_TOKEN_URI: "http://identity-backend.identity.svc.cluster.local:8000/oauth2/token"
  # Token lifetimes
  LOCAL_ACCESS_TOKEN_EXPIRE_SECONDS: "1800"
  LOCAL_REFRESH_TOKEN_EXPIRE_SECONDS: "604800"
