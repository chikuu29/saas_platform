# kube-prometheus-stack — Prometheus, Grafana, Alertmanager, kube-state-metrics, node-exporter.
# Multi-source: chart from upstream Helm registry, values from this Git repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    # Source 1: Helm chart from upstream
    - chart: kube-prometheus-stack
      repoURL: https://prometheus-community.github.io/helm-charts
      targetRevision: 67.9.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/infra/gitops/monitoring/prometheus-values.yaml
    # Source 2: Git repo — provides the values file
    - repoURL: https://github.com/chikuu29/saas_platform.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
