apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  # ArgoCD Applications (Helm multi-source — values pulled from Git)
  - prometheus-app.yaml
  - loki-app.yaml
  # Standalone Ingress resources (with custom annotations)
  - grafana-ingress.yaml
  - prometheus-ingress.yaml
  - alertmanager-ingress.yaml
  # Dashboards and alerting rules
  - dashboards/
  - alerting/
