apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - kube-prometheus-stack/
  - loki-stack/
  - dashboards/
  - grafana-ingress.yaml     # Standalone Ingress for grafana.local
  - prometheus-ingress.yaml  # Standalone Ingress for prometheus.local
  - alertmanager-ingress.yaml # Standalone Ingress for alertmanager.local
  # alerting/ uses PrometheusRule CRD — re-add after kube-prometheus-stack is fully synced
  - alerting/

