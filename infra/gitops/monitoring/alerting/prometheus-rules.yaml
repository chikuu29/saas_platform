# PrometheusRule — Custom alert rules for the SaaS platform.
# These CRDs are installed by kube-prometheus-stack and picked up automatically.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: saas-platform-alerts
  namespace: monitoring
  labels:
    # This label is required for kube-prometheus-stack to discover the rules
    release: kube-prometheus-stack
spec:
  groups:
    # ── API Error Rate Alerts ───────────────────────────────────────────────
    - name: saas.api.errors
      interval: 30s
      rules:
        - alert: IdentityBackendHighErrorRate
          expr: |
            rate(http_requests_total{namespace="identity", job="saas-identity-backend", status=~"5.."}[5m])
            /
            rate(http_requests_total{namespace="identity", job="saas-identity-backend"}[5m]) > 0.01
          for: 5m
          labels:
            severity: critical
            service: identity-backend
          annotations:
            summary: "Identity backend error rate above 1%"
            description: "Identity backend is returning {{ $value | humanizePercentage }} 5xx errors."
            runbook: "Check kubectl logs -n identity -l app=identity-backend"

        - alert: WorkspaceBackendHighErrorRate
          expr: |
            rate(http_requests_total{namespace="workspace", job="saas-workspace-backend", status=~"5.."}[5m])
            /
            rate(http_requests_total{namespace="workspace", job="saas-workspace-backend"}[5m]) > 0.01
          for: 5m
          labels:
            severity: critical
            service: workspace-backend
          annotations:
            summary: "Workspace backend error rate above 1%"
            description: "Workspace backend is returning {{ $value | humanizePercentage }} 5xx errors."

    # ── Latency Alerts ─────────────────────────────────────────────────────
    - name: saas.api.latency
      rules:
        - alert: IdentityBackendHighLatency
          expr: |
            histogram_quantile(0.99,
              rate(http_request_duration_seconds_bucket{namespace="identity", job="saas-identity-backend"}[5m])
            ) > 2
          for: 5m
          labels:
            severity: warning
            service: identity-backend
          annotations:
            summary: "Identity backend p99 latency > 2s"
            description: "99th percentile request latency is {{ $value }}s"

        - alert: WorkspaceBackendHighLatency
          expr: |
            histogram_quantile(0.99,
              rate(http_request_duration_seconds_bucket{namespace="workspace", job="saas-workspace-backend"}[5m])
            ) > 2
          for: 5m
          labels:
            severity: warning
            service: workspace-backend
          annotations:
            summary: "Workspace backend p99 latency > 2s"
            description: "99th percentile request latency is {{ $value }}s"

    # ── Pod Health Alerts ───────────────────────────────────────────────────
    - name: saas.pods
      rules:
        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace=~"identity|workspace"}[10m]) * 600 > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarted {{ $value }} times in 10m"

        - alert: PodNotReady
          expr: |
            kube_pod_status_ready{namespace=~"identity|workspace", condition="true"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is not ready"

    # ── Storage Alerts ─────────────────────────────────────────────────────
    - name: saas.storage
      rules:
        - alert: PVCHighUsage
          expr: |
            (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} usage above 80%"
            description: "Volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"

    # ── Memory Alerts ──────────────────────────────────────────────────────
    - name: saas.resources
      rules:
        - alert: HighMemoryUsage
          expr: |
            container_memory_working_set_bytes{namespace=~"identity|workspace", container!=""}
            /
            kube_pod_container_resource_limits{namespace=~"identity|workspace", resource="memory"} > 0.90
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.container }} memory above 90% of limit"
