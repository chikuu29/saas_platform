# Loki Stack — lightweight log aggregation.
# Promtail (DaemonSet) ships pod logs → Loki → Grafana Explore.
# Multi-source: chart from upstream Helm registry, values from this Git repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    # Source 1: Helm chart from upstream
    - chart: loki-stack
      repoURL: https://grafana.github.io/helm-charts
      targetRevision: 2.10.2
      helm:
        releaseName: loki-stack
        valueFiles:
          - $values/infra/gitops/monitoring/loki-values.yaml
    # Source 2: Git repo — provides the values file
    - repoURL: https://github.com/chikuu29/saas_platform.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
