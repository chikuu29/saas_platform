# kube-prometheus-stack — managed by ArgoCD via Helm.
# Includes: Prometheus, Grafana, Alertmanager, kube-state-metrics, node-exporter.
#
# This is an ArgoCD Application (not a Kustomize resource) that uses Helm.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 67.9.0
    helm:
      releaseName: kube-prometheus-stack
      valueFiles:
        - values.yaml
      # Values file is loaded from the same path in the Git repo
      # ArgoCD resolves this relative to the application's source path
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # CRDs need replace strategy on first install
      - Replace=false
