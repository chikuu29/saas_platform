# kube-prometheus-stack — managed by ArgoCD via Helm.
# Includes: Prometheus, Grafana, Alertmanager, kube-state-metrics, node-exporter.
#
# Uses multi-source so ArgoCD pulls the chart from upstream Helm registry
# while reading values.yaml from our Git repo. This ensures Git changes
# to values.yaml are detected and synced automatically.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    # Source 1: Helm chart from upstream registry
    - chart: kube-prometheus-stack
      repoURL: https://prometheus-community.github.io/helm-charts
      targetRevision: 67.9.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          # $values references our Git repo (Source 2) — ArgoCD resolves
          # this path relative to the Git repo root
          - $values/infra/gitops/monitoring/kube-prometheus-stack/values.yaml
    # Source 2: Git repo providing the values file
    - repoURL: https://github.com/chikuu29/saas_platform.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
