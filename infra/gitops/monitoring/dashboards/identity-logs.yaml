# Identity Backend Logs Dashboard — auto-provisioned via ConfigMap sidecar.
# Visualizes log levels (ERROR, WARNING, INFO, DEBUG) using Loki datasource.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-identity-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  identity-logs.json: |
    {
      "title": "Identity Server — Logs",
      "uid": "identity-server-logs",
      "schemaVersion": 38,
      "version": 1,
      "tags": ["saas", "identity", "logs", "loki"],
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "10s",
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "pod",
            "label": "Pod",
            "type": "query",
            "datasource": { "type": "loki", "uid": "" },
            "query": "{namespace=\"identity\", app=\"identity-backend\"} | label_values pod",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [

        {
          "id": 1,
          "title": "🔴 Error Log Count (1m rate)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "loki", "uid": "" },
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"identity\", app=\"identity-backend\"} |~ \"(?i)(ERROR|error|Error)\" [1m]))",
            "legendFormat": "Errors/min"
          }],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [
                { "value": 0, "color": "green" },
                { "value": 1, "color": "orange" },
                { "value": 5, "color": "red" }
              ]}
            }
          }
        },

        {
          "id": 2,
          "title": "⚠️ Warning Log Count (1m rate)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "loki", "uid": "" },
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"identity\", app=\"identity-backend\"} |~ \"(?i)(WARNING|WARN|warning|warn)\" [1m]))",
            "legendFormat": "Warnings/min"
          }],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [
                { "value": 0, "color": "green" },
                { "value": 1, "color": "yellow" },
                { "value": 10, "color": "orange" }
              ]}
            }
          }
        },

        {
          "id": 3,
          "title": "ℹ️ Info Log Count (1m rate)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "loki", "uid": "" },
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"identity\", app=\"identity-backend\"} |~ \"(?i)(INFO|info)\" [1m]))",
            "legendFormat": "Info/min"
          }],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "fixed", "fixedColor": "blue" }
            }
          }
        },

        {
          "id": 4,
          "title": "🐛 Debug Log Count (1m rate)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "loki", "uid": "" },
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"identity\", app=\"identity-backend\"} |~ \"(?i)(DEBUG|debug)\" [1m]))",
            "legendFormat": "Debug/min"
          }],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "fixed", "fixedColor": "purple" }
            }
          }
        },

        {
          "id": 10,
          "title": "📊 Log Volume by Level",
          "description": "Log line count over time, grouped by log level",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 4 },
          "datasource": { "type": "loki", "uid": "" },
          "targets": [
            {
              "expr": "sum(count_over_time({namespace=\"identity\", app=\"identity-backend\"} |~ \"(?i)error\" [1m]))",
              "legendFormat": "ERROR"
            },
            {
              "expr": "sum(count_over_time({namespace=\"identity\", app=\"identity-backend\"} |~ \"(?i)(warning|warn)\" [1m]))",
              "legendFormat": "WARNING"
            },
            {
              "expr": "sum(count_over_time({namespace=\"identity\", app=\"identity-backend\"} |~ \"(?i)info\" [1m]))",
              "legendFormat": "INFO"
            },
            {
              "expr": "sum(count_over_time({namespace=\"identity\", app=\"identity-backend\"} |~ \"(?i)debug\" [1m]))",
              "legendFormat": "DEBUG"
            }
          ],
          "options": {
            "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": { "showLegend": true, "displayMode": "table", "placement": "right", "calcs": ["sum", "mean", "max"] }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "lineWidth": 2, "fillOpacity": 30, "gradientMode": "opacity", "stacking": { "mode": "normal" }, "drawStyle": "bars" }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "ERROR" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }] },
              { "matcher": { "id": "byName", "options": "WARNING" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } }] },
              { "matcher": { "id": "byName", "options": "INFO" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } }] },
              { "matcher": { "id": "byName", "options": "DEBUG" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "purple" } }] }
            ]
          }
        },

        {
          "id": 20,
          "title": "🔴 Error Logs — Live Stream",
          "type": "logs",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 12 },
          "datasource": { "type": "loki", "uid": "" },
          "targets": [{
            "expr": "{namespace=\"identity\", app=\"identity-backend\"} |~ \"(?i)(ERROR|error|Error|Traceback|exception|Exception)\"",
            "maxLines": 200
          }],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        },

        {
          "id": 30,
          "title": "📋 All Logs — Identity Backend",
          "description": "Full log stream with all levels",
          "type": "logs",
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 22 },
          "datasource": { "type": "loki", "uid": "" },
          "targets": [{
            "expr": "{namespace=\"identity\", app=\"identity-backend\"}",
            "maxLines": 500
          }],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        }

      ]
    }
