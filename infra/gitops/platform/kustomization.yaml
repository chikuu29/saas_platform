apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# saas-platform-infra — root kustomization.
#
# Apply order is critical for a stable cluster boot sequence:
#   1. namespaces/   — Namespace objects must exist before anything deploys into them
#   2. controllers/  — Sealed Secrets controller must decrypt secrets before StatefulSets start
#   3. identity-db/  — PostgreSQL + Redis for the identity namespace
#   4. workspace-db/ — MongoDB for the workspace namespace
resources:
  - namespaces/
  - controllers/
  - identity-db/
  - workspace-db/
