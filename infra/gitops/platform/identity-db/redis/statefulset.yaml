apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: identity-redis
  namespace: identity
  labels:
    app: identity-redis
    app.kubernetes.io/part-of: saas-platform
spec:
  serviceName: identity-redis
  replicas: 1
  selector:
    matchLabels:
      app: identity-redis
  template:
    metadata:
      labels:
        app: identity-redis
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --save
            - "60"
            - "1"
            - --loglevel
            - warning
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: identity-redis-pvc
