apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Redis — session cache store for the identity service.
# Namespace "identity" is pre-created by saas-platform-infra/namespaces/ — do NOT add it here.
# No secrets required — Redis runs without authentication in this setup.
resources:
  - pvc.yaml
  - statefulset.yaml
  - service.yaml
