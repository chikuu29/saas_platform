apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: identity-postgres-pvc
  namespace: identity
spec:
  accessModes:
    - ReadWriteOnce
  # local-path is the default StorageClass in k3s — provisions a hostPath PV
  # automatically on the node where the pod is scheduled.
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
