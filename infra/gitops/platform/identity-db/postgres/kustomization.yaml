apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PostgreSQL — primary relational store for the identity service.
# Namespace "identity" is pre-created by saas-platform-infra/namespaces/ — do NOT add it here.
# Sealed Secrets controller (saas-platform-infra/controllers/) must be running first
# so sealed-secret.yaml and identity-app-secret.yaml can decrypt before the StatefulSet starts.
resources:
  - pvc.yaml
  - sealed-secret.yaml
  - identity-app-secret.yaml
  - statefulset.yaml
  - service.yaml
