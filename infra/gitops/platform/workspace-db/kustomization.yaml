apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# MongoDB — primary document store for the workspace service.
# Namespace "workspace" is pre-created by saas-platform-infra/namespaces/ — do NOT add it here.
# Sealed Secrets controller (saas-platform-infra/controllers/) must be running first
# so sealed-secret.yaml can decrypt before the StatefulSet starts.
resources:
  - pvc.yaml
  - sealed-secret.yaml
  - configmap-init.yaml
  - statefulset.yaml
  - service.yaml
