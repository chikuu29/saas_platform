# NGINX Ingress Controller — installed via Helm, managed by ArgoCD.
#
# WHY NGINX over Traefik?
#   - Industry standard — used in 80%+ of production Kubernetes deployments
#   - Extremely well-documented, massive community
#   - Battle-tested performance and reliability
#   - Standard networking.k8s.io/v1 Ingress API — no vendor-specific CRDs
#   - Fine-grained tuning via nginx.ingress.kubernetes.io annotations
#
# We disable k3s's built-in Traefik at cluster creation time (--no-deploy=traefik)
# and install NGINX instead to have full control.
#
# Sync Wave -1: NGINX must be running BEFORE any Ingress resources are applied,
# otherwise Ingress objects sit as "no controller found" errors.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: ingress-nginx
    repoURL: https://kubernetes.github.io/ingress-nginx
    targetRevision: 4.10.1
    helm:
      releaseName: ingress-nginx
      values: |
        controller:
          # Use NodePort so k3d's port mapping (80→80) works correctly
          # Without this, the LoadBalancer would stay in <pending> state locally
          extraArgs:
            default-ssl-certificate: "ingress-nginx/local-wildcard-tls"
          service:
            type: NodePort
            nodePorts:
              http: 30080
              https: 30443
          # Publish the node IP so Ingress status.loadBalancer.ingress is populated
          # Required for ArgoCD health checks to show Ingress as Healthy
          publishService:
            enabled: false
          hostNetwork: true
          # Allow NGINX to bind directly to host ports 80/443 via hostNetwork
          kind: DaemonSet
          # Resource allocation — lightweight for local dev
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Enable Prometheus metrics from NGINX controller
          metrics:
            enabled: true
            serviceMonitor:
              enabled: false   # Enable when kube-prometheus-stack is deployed
          # NGINX configuration tuning for FastAPI
          config:
            # Increase proxy timeouts for long-running API calls
            proxy-read-timeout: "120"
            proxy-send-timeout: "120"
            # Enable access logs
            enable-access-log-params: "true"
            # Use real client IP (important for rate limiting in identity-backend)
            use-forwarded-headers: "true"
            compute-full-forwarded-for: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
