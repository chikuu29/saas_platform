# ArgoCD Application — SaaS Platform Infrastructure (wave 0)
#
# Deploys all foundational platform resources:
#   - Namespaces (identity, workspace) — decoupled from any component lifecycle
#   - Controllers (Sealed Secrets, Ingress TLS cert)
#   - Identity database tier (PostgreSQL + Redis)
#   - Workspace database tier (MongoDB)
#
# Must sync BEFORE apps (wave 1) since backends depend on the databases
# and namespaces must exist before any workload deploys into them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: saas-platform-infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/chikuu29/saas_platform.git
    targetRevision: HEAD
    path: infra/gitops/platform
  destination:
    server: https://kubernetes.default.svc
    # Resources specify their own namespaces (identity, workspace, kube-system)
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      # StatefulSets need this to avoid PVC recreation on plan changes
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
